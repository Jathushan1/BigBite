spring.application.name=bigbite-backend

# Native .env file import
spring.config.import=optional:file:.env[.properties]

# Server Port
server.port=${PORT:8080}

# Aiven MySQL Datasource Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://mysql-13ba3984-jathushansundararasu-23c8.l.aivencloud.com:16805/defaultdb?sslmode=require}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.open-in-view=false

# JWT Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Order and COD rules
bigbite.order.tax-rate=${ORDER_TAX_RATE:0.05}
bigbite.order.delivery-fee=${ORDER_DELIVERY_FEE:300.00}
bigbite.order.min-subtotal=${ORDER_MIN_SUBTOTAL:500.00}
bigbite.order.payment-timeout-minutes=${ORDER_PAYMENT_TIMEOUT_MINUTES:15}
bigbite.order.max-card-attempts=${ORDER_MAX_CARD_ATTEMPTS:3}
bigbite.order.acceptance-timeout-minutes=${ORDER_ACCEPTANCE_TIMEOUT_MINUTES:10}
bigbite.order.max-refund-attempts=${ORDER_MAX_REFUND_ATTEMPTS:5}
bigbite.order.complaint-window-hours=${ORDER_COMPLAINT_WINDOW_HOURS:48}
bigbite.cod.allow-guest=${COD_ALLOW_GUEST:false}
bigbite.cod.max-order-total=${COD_MAX_ORDER_TOTAL:10000.00}
bigbite.cod.strike-limit=${COD_STRIKE_LIMIT:2}
bigbite.cod.max-open-orders=${COD_MAX_OPEN_ORDERS:2}

# Seeded Super Admin Credentials
app.admin.email=${APP_ADMIN_EMAIL:admin@bigbite.com}
app.admin.password=${APP_ADMIN_PASSWORD:Admin@123}

# Demo data (3 branches, menus, team accounts, a customer) when the branches table is empty
app.seed-demo=${APP_SEED_DEMO:true}

# Frontend origin used in emailed links
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}

# Password reset
app.auth.reset-token-ttl-minutes=${RESET_TOKEN_TTL_MINUTES:30}
app.auth.reset-max-requests=${RESET_MAX_REQUESTS:3}
app.auth.reset-max-requests-per-ip=${RESET_MAX_REQUESTS_PER_IP:10}
app.auth.reset-window-minutes=${RESET_WINDOW_MINUTES:15}

# Email: keep app.mail.mock=true to use the in-memory outbox (/dev/outbox in the UI).
# For real email set APP_MAIL_MOCK=false and the SMTP settings below (e.g. a Gmail app password).
app.mail.mock=${APP_MAIL_MOCK:true}
app.mail.outbox-public=${APP_MAIL_OUTBOX_PUBLIC:true}
app.mail.from=${APP_MAIL_FROM:BigBite <no-reply@bigbite.lk>}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Mocks for neighbouring modules that are not built yet (delivery, inventory, refunds)
bigbite.mock.delivery.trip-minutes=${MOCK_DELIVERY_TRIP_MINUTES:25}
bigbite.mock.inventory.out-of-stock-items=${MOCK_OUT_OF_STOCK_ITEMS:}
bigbite.mock.refund.fail-next=${MOCK_REFUND_FAIL_NEXT:0}

